<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Мессенджер</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css" />
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-auth-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 h-screen overflow-hidden">

  <!-- Экран входа -->
  <div id="login-screen" class="fixed inset-0 flex items-center justify-center bg-slate-900 z-50">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md mx-4">
      <h1 class="text-3xl font-bold text-center mb-2 bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
        Мессенджер
      </h1>
      <p class="text-slate-400 text-center mb-6">Чат • Файлы • Звонки</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1">Ваше имя</label>
          <input id="name-input" type="text" placeholder="Как вас зовут?" 
                 class="w-full px-4 py-3 bg-slate-700 rounded-xl border border-slate-600 focus:border-cyan-500 focus:outline-none transition"
                 maxlength="30" autocomplete="off" />
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1">Комната</label>
          <input id="room-input" type="text" value="general" placeholder="Название комнаты"
                 class="w-full px-4 py-3 bg-slate-700 rounded-xl border border-slate-600 focus:border-cyan-500 focus:outline-none transition"
                 maxlength="30" autocomplete="off" />
        </div>
        <button id="join-btn" 
                class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 rounded-xl font-semibold transition">
          Войти
        </button>
        <p id="login-error" class="text-red-400 text-sm text-center hidden mt-2 px-2"></p>
      </div>
    </div>
  </div>

  <!-- Основной интерфейс -->
  <div id="app" class="hidden h-full flex flex-col md:flex-row">
    
    <!-- Боковая панель -->
    <aside class="w-full md:w-72 bg-slate-800 border-b md:border-b-0 md:border-r border-slate-700 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-700 flex items-center gap-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-bold text-lg shrink-0" id="avatar">?</div>
        <div class="min-w-0 flex-1">
          <div class="font-semibold truncate" id="my-name">—</div>
          <div class="text-xs text-slate-400">Комната: <span id="my-room">general</span></div>
        </div>
        <button id="leave-btn" class="text-xs px-2 py-1 rounded-lg bg-slate-700 hover:bg-red-600 transition shrink-0" title="Выйти">Выйти</button>
      </div>
      
      <div class="p-3 text-xs font-semibold text-slate-400 uppercase tracking-wider hidden md:block">Онлайн</div>
      <div id="users-list" class="flex-1 overflow-y-auto px-2 space-y-1 min-h-[4.5rem] max-h-40 md:max-h-none">
        <!-- Пользователи -->
      </div>
    </aside>

    <!-- Чат -->
    <main class="flex-1 flex flex-col min-h-0">
      <header class="h-12 bg-slate-800 border-b border-slate-700 flex items-center justify-between px-4 shrink-0">
        <div class="font-semibold"># <span id="room-title">general</span></div>
        <div class="text-sm text-slate-400" id="online-count">0 онлайн</div>
      </header>

      <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Сообщения -->
      </div>

      <div class="p-3 bg-slate-800 border-t border-slate-700 shrink-0">
        <div class="flex gap-2 items-end">
          <label class="cursor-pointer p-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl transition shrink-0" title="Файл">
            <input type="file" id="file-input" class="hidden" />
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
            </svg>
          </label>
          
          <textarea id="message-input" rows="1" placeholder="Сообщение..."
                    class="flex-1 px-4 py-2.5 bg-slate-700 rounded-xl border border-slate-600 focus:border-cyan-500 focus:outline-none resize-none max-h-28"
                    maxlength="2000"></textarea>
          
          <button id="send-btn" class="p-2.5 bg-cyan-600 hover:bg-cyan-500 rounded-xl transition shrink-0">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
            </svg>
          </button>
        </div>
        <div id="upload-progress" class="hidden mt-2 text-xs text-cyan-400"></div>
      </div>
    </main>
  </div>

  <!-- Входящий звонок -->
  <div id="incoming-call" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4">
    <div class="bg-slate-800 rounded-2xl p-8 text-center shadow-2xl max-w-sm w-full">
      <div class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-br from-green-400 to-emerald-600 flex items-center justify-center text-3xl animate-pulse">📞</div>
      <h2 class="text-xl font-bold mb-1" id="caller-name">Кто-то</h2>
      <p class="text-slate-400 mb-6" id="call-type">Входящий звонок...</p>
      <div class="flex gap-4 justify-center">
        <button id="accept-call" class="px-6 py-3 bg-green-600 hover:bg-green-500 rounded-xl font-semibold">Принять</button>
        <button id="reject-call" class="px-6 py-3 bg-red-600 hover:bg-red-500 rounded-xl font-semibold">Отклонить</button>
      </div>
    </div>
  </div>

  <!-- Активный звонок -->
  <div id="call-ui" class="hidden fixed inset-0 bg-slate-900 z-40 flex flex-col">
    <div class="flex-1 relative flex items-center justify-center bg-black">
      <video id="remote-video" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
      <video id="local-video" autoplay playsinline muted class="absolute bottom-24 right-4 w-28 h-20 md:w-40 md:h-28 object-cover rounded-xl border-2 border-slate-600 shadow-lg"></video>
      <div id="audio-only-ui" class="hidden text-center">
        <div class="w-28 h-28 mx-auto mb-4 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center text-5xl">👤</div>
        <div class="text-2xl font-semibold" id="remote-name">Собеседник</div>
        <div class="text-slate-400 mt-2" id="call-status">Соединение...</div>
      </div>
    </div>
    <div class="h-20 bg-slate-800 flex items-center justify-center gap-6">
      <button id="toggle-mic" class="w-14 h-14 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center" title="Микрофон">🎤</button>
      <button id="toggle-cam" class="w-14 h-14 rounded-full bg-slate-700 hover:bg-slate-600 flex items-center justify-center" title="Камера">📷</button>
      <button id="end-call" class="w-16 h-16 rounded-full bg-red-600 hover:bg-red-500 flex items-center justify-center text-2xl" title="Завершить">📵</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
